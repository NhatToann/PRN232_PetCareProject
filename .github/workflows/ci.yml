name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build + Test (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PetShop_PRN222.sln

      - name: Build
        run: dotnet build PetShop_PRN222.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/PetShop.Tests/PetShop.Tests.csproj --configuration Release --no-build --nologo
